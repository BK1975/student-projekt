<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport-fit=cover: vsebina se razširi pod "notch" / zaobljene robove (iOS),
    odmike pa nato uredimo z env(safe-area-inset-*).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Zdravje+</title>

  <style>
    /* =========================================================
       1. OBLIKOVNI ŽETONI (barve, razmiki, zaobljenost)
       ========================================================= */
    :root {
      /* Ozadje in besedilo */
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;

      /* Študijski način – modra */
      --study: #2563eb;
      --study-dark: #1e40af;

      /* Vitalni način – zelena (temnejši odtenek za visok kontrast z belim besedilom) */
      --vital: #15803d;
      --vital-dark: #14532d;

      --radius: 24px;
      --gap: clamp(16px, 4vw, 28px);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.15);

      /* Varni odmiki za telefone z izrezom (notch) */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Temni način sistema */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f8fafc;
        --text-muted: #cbd5e1;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
    }

    /* =========================================================
       2. OSNOVNI SLOGI
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      /* Prepreči modro "bliskanje" ob dotiku na Androidu */
      -webkit-tap-highlight-color: transparent;
    }

    /* Pomožni razred za skrivanje zaslonov */
    .hidden {
      display: none !important;
    }

    /* =========================================================
       3. ZAČETNI ZASLON
       ========================================================= */
    .screen {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--gap);
      padding: calc(var(--gap) + var(--safe-top)) var(--gap) calc(var(--gap) + var(--safe-bottom));
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header p {
      margin-top: 6px;
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      color: var(--text-muted);
    }

    /* Mreža gumbov: na telefonu eden pod drugim, na tablici (≥ 700px) drug ob drugem */
    .modes {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
    }

    @media (min-width: 700px) {
      .modes {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* =========================================================
       4. VELIKA GUMBA ZA IZBIRO NAČINA
       ========================================================= */
    .mode-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: clamp(200px, 32vh, 320px);
      padding: 28px 20px;
      border: none;
      border-radius: var(--radius);
      color: #ffffff;
      font-family: inherit;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .mode-btn:hover {
      filter: brightness(1.05);
    }

    /* Občutek "pritiska" ob dotiku */
    .mode-btn:active {
      transform: scale(0.97);
    }

    /* Jasen fokus za uporabo s tipkovnico / bralniki zaslona */
    .mode-btn:focus-visible {
      outline: 4px solid var(--text);
      outline-offset: 4px;
    }

    .mode-btn svg {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .mode-btn .title {
      font-size: clamp(1.5rem, 5vw, 1.9rem);
      font-weight: 700;
    }

    .mode-btn .subtitle {
      font-size: 1rem;
      opacity: 0.9;
    }

    /* --- Študijski način: moderen modri gradient --- */
    .mode-btn--study {
      background: linear-gradient(135deg, var(--study), var(--study-dark));
    }

    /* --- Vitalni način: večji tekst, visok kontrast, debela obroba --- */
    .mode-btn--vital {
      background: var(--vital);
      border: 4px solid var(--vital-dark);
    }

    .mode-btn--vital svg {
      width: 80px;
      height: 80px;
    }

    .mode-btn--vital .title {
      font-size: clamp(2rem, 7vw, 2.6rem);
      font-weight: 800;
    }

    .mode-btn--vital .subtitle {
      font-size: clamp(1.25rem, 4.5vw, 1.45rem);
      font-weight: 600;
      opacity: 1; /* brez prosojnosti = boljši kontrast */
    }

    /* =========================================================
       5. ZASLON PO IZBIRI NAČINA
       ========================================================= */
    .result {
      align-items: center;
      text-align: center;
    }

    .result-card {
      width: 100%;
      max-width: 560px;
      padding: 40px 24px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-top: 8px solid var(--accent, var(--study));
    }

    .result-card h2 {
      font-size: clamp(1.5rem, 5.5vw, 2rem);
      font-weight: 700;
    }

    /* Večje besedilo, če je izbran vitalni način */
    .result--vital .result-card h2 {
      font-size: clamp(2rem, 7vw, 2.6rem);
      font-weight: 800;
    }

    .back-btn {
      margin-top: 28px;
      padding: 14px 28px;
      min-height: 48px; /* priporočena najmanjša velikost cilja za dotik */
      border: 2px solid var(--text-muted);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .back-btn:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }

    /* =========================================================
       6. ŠTUDIJSKI NAČIN – Pomodoro časovnik
       ========================================================= */
    .study {
      align-items: center;
      text-align: center;
    }

    /* Vrstica z gumbom "Nazaj" na vrhu zaslona */
    .topbar {
      width: 100%;
      max-width: 560px;
      display: flex;
    }

    /* Gumb "Nazaj" na vrhu ni treba odmikati od vsebine nad njim */
    .topbar .back-btn {
      margin-top: 0;
    }

    .study h1 {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 800;
      color: var(--study);
    }

    .timer-card {
      width: 100%;
      max-width: 560px;
      padding: 32px 24px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-top: 8px solid var(--study);
    }

    /* Velike številke; tabular-nums prepreči "poskakovanje" števk */
    .timer-display {
      font-size: clamp(4rem, 20vw, 7rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .timer-status {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .btn {
      min-width: 140px;
      min-height: 52px;
      padding: 12px 24px;
      border: none;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }

    .btn--primary {
      background: var(--study);
      color: #ffffff;
    }

    .btn--secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--text-muted);
    }

    /* Majhen gumb samo za testiranje (skrajša čas na 5 s) */
    .btn--test {
      margin-top: 20px;
      min-height: 40px;
      min-width: 0;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      background: transparent;
      color: var(--text-muted);
      border: 1px dashed var(--text-muted);
    }

    /* =========================================================
       7. ODMOR – prekrivni sloj čez cel zaslon
       ========================================================= */
    .break-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: calc(32px + var(--safe-top)) 24px calc(32px + var(--safe-bottom));
      background: linear-gradient(135deg, var(--study), var(--study-dark));
      color: #ffffff;
      text-align: center;
      animation: fade-in 0.3s ease;
    }

    .break-overlay .break-label {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.85;
    }

    .break-overlay .break-tip {
      max-width: 640px;
      font-size: clamp(1.8rem, 7vw, 3rem);
      font-weight: 800;
      line-height: 1.25;
    }

    .break-overlay .btn {
      background: #ffffff;
      color: var(--study-dark);
    }

    .break-overlay .btn:focus-visible {
      outline-color: #ffffff;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Spoštuj nastavitev "zmanjšaj gibanje" */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- =========================================================
       ZAČETNI ZASLON – izbira načina
       ========================================================= -->
  <main id="home-screen" class="screen">
    <header class="header">
      <h1>Zdravje+</h1>
      <p>Izberite način uporabe</p>
    </header>

    <section class="modes" aria-label="Izbira načina">
      <!-- Gumb 1: Študijski način (ikona ure) -->
      <button class="mode-btn mode-btn--study" type="button" data-mode="Študijski">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <polyline points="12 7 12 12 15.5 14" />
        </svg>
        <span class="title">Študijski način</span>
        <span class="subtitle">Fokus, odmori in spanec</span>
      </button>

      <!-- Gumb 2: Vitalni način (ikona srca) – prilagojen starejšim -->
      <button class="mode-btn mode-btn--vital" type="button" data-mode="Vitalni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z" />
        </svg>
        <span class="title">Vitalni način</span>
        <span class="subtitle">Zdravila in počutje</span>
      </button>
    </section>
  </main>

  <!-- =========================================================
       ZASLON Z REZULTATOM – prikaže se po kliku na gumb
       ========================================================= -->
  <main id="result-screen" class="screen result hidden" aria-live="polite">
    <div class="result-card">
      <h2 id="result-text"></h2>
      <button id="back-btn" class="back-btn" type="button">← Nazaj</button>
    </div>
  </main>

  <!-- =========================================================
       ŠTUDIJSKI NAČIN – Pomodoro časovnik
       ========================================================= -->
  <main id="study-screen" class="screen study hidden">
    <div class="topbar">
      <button id="study-back-btn" class="back-btn" type="button">← Nazaj</button>
    </div>

    <h1>Študijski fokus</h1>

    <section class="timer-card" aria-label="Pomodoro časovnik">
      <!-- role="timer" bralnikom zaslona pove, da gre za odštevalnik -->
      <div id="timer-display" class="timer-display" role="timer">45:00</div>
      <p id="timer-status" class="timer-status">Pripravljen na učenje</p>

      <div class="timer-controls">
        <button id="start-btn" class="btn btn--primary" type="button">Začni</button>
        <button id="reset-btn" class="btn btn--secondary" type="button">Ponastavi</button>
      </div>

      <!-- Samo za testiranje: nastavi časovnik na 5 sekund -->
      <button id="test-btn" class="btn btn--test" type="button">Test: 5 sekund</button>
    </section>
  </main>

  <!-- =========================================================
       ODMOR – prikaže se čez cel zaslon, ko se čas izteče
       ========================================================= -->
  <div id="break-overlay" class="break-overlay hidden" role="alertdialog"
       aria-modal="true" aria-labelledby="break-tip">
    <p class="break-label">Čas za odmor</p>
    <p id="break-tip" class="break-tip"></p>
    <button id="break-back-btn" class="btn" type="button">Nazaj na učenje</button>
  </div>

  <script>
    // =========================================================
    // 1. NAVIGACIJA MED ZASLONI
    // =========================================================

    // Reference na elemente, ki jih potrebujemo
    const homeScreen = document.getElementById('home-screen');
    const resultScreen = document.getElementById('result-screen');
    const studyScreen = document.getElementById('study-screen');
    const resultText = document.getElementById('result-text');
    const backBtn = document.getElementById('back-btn');
    const modeButtons = document.querySelectorAll('.mode-btn');

    /**
     * Odpre izbrani način. Študijski način ima svoj zaslon s časovnikom,
     * Vitalni način (zaenkrat) pokaže samo preprosto sporočilo.
     * @param {string} mode - ime načina, npr. "Študijski" ali "Vitalni"
     */
    function loadMode(mode) {
      homeScreen.classList.add('hidden');

      if (mode === 'Študijski') {
        studyScreen.classList.remove('hidden');
        startBtn.focus();
        return;
      }

      // Vitalni način – začasni zaslon s sporočilom
      resultText.textContent = `Naložen je ${mode} način`;
      resultScreen.style.setProperty('--accent', 'var(--vital)');
      resultScreen.classList.add('result--vital');
      resultScreen.classList.remove('hidden');
      backBtn.focus(); // fokus na "Nazaj" – pomaga pri dostopnosti
    }

    /** Vrne uporabnika na začetni zaslon in ustavi morebitni časovnik. */
    function goHome() {
      resetTimer();
      resultScreen.classList.add('hidden');
      studyScreen.classList.add('hidden');
      homeScreen.classList.remove('hidden');
    }

    // Ime načina preberemo iz atributa data-mode na gumbu
    modeButtons.forEach((button) => {
      button.addEventListener('click', () => loadMode(button.dataset.mode));
    });

    backBtn.addEventListener('click', goHome);
    document.getElementById('study-back-btn').addEventListener('click', goHome);

    // =========================================================
    // 2. POMODORO ČASOVNIK
    // =========================================================

    const DEFAULT_SECONDS = 45 * 60; // privzeto 45 minut
    const TEST_SECONDS = 5;          // za testiranje

    const timerDisplay = document.getElementById('timer-display');
    const timerStatus = document.getElementById('timer-status');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const testBtn = document.getElementById('test-btn');

    let durationSeconds = DEFAULT_SECONDS; // trajanje trenutnega cikla
    let remainingSeconds = DEFAULT_SECONDS;
    let endTime = null;   // časovni žig konca (ms), ko časovnik teče
    let intervalId = null;

    /** Pretvori sekunde v obliko MM:SS. */
    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    /** Osveži prikaz časa in besedilo gumba "Začni". */
    function render() {
      timerDisplay.textContent = formatTime(remainingSeconds);
      startBtn.textContent = intervalId
        ? 'Pavza'
        : remainingSeconds < durationSeconds ? 'Nadaljuj' : 'Začni';
    }

    /**
     * En "tik" časovnika. Preostanek računamo iz končnega časa namesto
     * odštevanja po 1 s – tako časovnik ostane točen, tudi če brskalnik
     * v ozadju upočasni setInterval.
     */
    function tick() {
      remainingSeconds = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      render();
      if (remainingSeconds === 0) finishTimer();
    }

    /** Zažene ali začasno ustavi časovnik (gumb "Začni" / "Pavza"). */
    function toggleTimer() {
      if (intervalId) {
        pauseTimer();
        return;
      }
      unlockAudio(); // zvok mora biti "odklenjen" ob kliku uporabnika
      endTime = Date.now() + remainingSeconds * 1000;
      intervalId = setInterval(tick, 250);
      timerStatus.textContent = 'Učenje poteka …';
      render();
    }

    function pauseTimer() {
      clearInterval(intervalId);
      intervalId = null;
      timerStatus.textContent = 'Na pavzi';
      render();
    }

    /** Ustavi časovnik in ga vrne na začetno trajanje. */
    function resetTimer(seconds = durationSeconds) {
      clearInterval(intervalId);
      intervalId = null;
      durationSeconds = seconds;
      remainingSeconds = seconds;
      timerStatus.textContent = 'Pripravljen na učenje';
      render();
    }

    /** Čas je potekel: pisk + prikaz odmora. */
    function finishTimer() {
      clearInterval(intervalId);
      intervalId = null;
      playBeep();
      showBreak();
    }

    startBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', () => resetTimer(DEFAULT_SECONDS));
    testBtn.addEventListener('click', () => resetTimer(TEST_SECONDS));

    // =========================================================
    // 3. ZVOK – pisk z Web Audio API (brez mp3 datotek)
    // =========================================================

    let audioCtx = null;

    /**
     * Brskalniki (zlasti iOS/Android WebView) dovolijo zvok šele po
     * dejanju uporabnika, zato AudioContext ustvarimo ob kliku "Začni".
     */
    function unlockAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return; // zelo stari brskalniki – brez zvoka
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    /** Predvaja tri kratke piske (880 Hz). */
    function playBeep() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      for (let i = 0; i < 3; i++) {
        const start = now + i * 0.3;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.value = 880;

        // Kratek dvig in upad glasnosti prepreči "klikanje" zvočnika
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);

        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.22);
      }
    }

    // =========================================================
    // 4. ODMOR – naključno zdravstveno navodilo
    // =========================================================

    const breakTips = [
      'Vstani in naredi 5 predklonov.',
      'Glej v daljavo 20 sekund, da spočiješ oči.',
      'Popij kozarec vode.',
      'Petkrat počasi in globoko vdihni ter izdihni.',
      'Nežno zakroži z rameni 10-krat naprej in 10-krat nazaj.',
      'Sprehodi se po prostoru vsaj 2 minuti.',
      'Raztegni roke visoko nad glavo in zadrži 10 sekund.',
      'Počasi obrni glavo levo in desno, da sprostiš vrat.',
      'Odpri okno in zadihaj svež zrak.',
      'Naredi 10 počepov, da poženeš kri po telesu.'
    ];

    const breakOverlay = document.getElementById('break-overlay');
    const breakTip = document.getElementById('break-tip');
    const breakBackBtn = document.getElementById('break-back-btn');

    /** Prikaže prekrivni zaslon z naključnim navodilom. */
    function showBreak() {
      breakTip.textContent = breakTips[Math.floor(Math.random() * breakTips.length)];
      breakOverlay.classList.remove('hidden');
      breakBackBtn.focus();
    }

    /** "Nazaj na učenje": skrije odmor in ponastavi časovnik. */
    breakBackBtn.addEventListener('click', () => {
      breakOverlay.classList.add('hidden');
      resetTimer();
      startBtn.focus();
    });

    // Začetni prikaz
    render();
  </script>
</body>
</html>
