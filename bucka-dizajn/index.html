<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bucka Dizajn Pick&amp;Collect</title>
<meta name="description" content="Interno orodje poslovalnice Bucka Dizajn za prevzem in izdajo oblačil.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bucka P&amp;C">
<style>
  /* Barve in slog po spletni strani buckadizajn.com */
  :root {
    --bg: #fff7fb;
    --card: #ffffff;
    --text: #263043;
    --muted: #6b6f80;
    --line: #f1dfe9;
    --brand: #c2479b;       /* rožnato-vijolična za besedilo in obrobe */
    --brand-dark: #9d3a84;
    --brand-soft: #fdeaf4;
    --pink: #f0609e;
    --purple: #8b5cf6;
    --grad: linear-gradient(90deg, var(--pink), var(--purple));
    --accent: #8b5cf6;
    --warn-bg: #fff4e8;
    --warn-line: #f6d2a8;
    --danger: #d63c5e;
    --danger-bg: #fdecf0;
    --radius: 18px;
    --shadow: 0 6px 22px rgba(214, 84, 160, .10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.45;
    background-image: radial-gradient(1200px 500px at 50% -120px, #fde3ee 0%, rgba(253, 227, 238, 0) 70%); background-repeat: no-repeat; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--brand); }
  [hidden] { display: none !important; }

  header {
    position: sticky; top: 0; z-index: 10; background: var(--brand); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .logo img { width: 34px; height: 34px; }
  .logo b { display: block; font-size: 1rem; }
  .logo small { display: block; font-size: .75rem; opacity: .85; }
  .iconbtn { border: 0; background: rgba(255,255,255,.15); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
  .mode { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.2); margin-left: 6px; }

  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 40px; }
  @media (min-width: 900px) {
    main { max-width: 1180px; padding: 20px 24px 48px; }
    .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start; }
    .cols > * > h2:first-child { margin-top: 0; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .cards .order { margin: 0; }
    .tabs button { font-size: .95rem; padding: 10px 4px; }
  }
  @media (min-width: 1300px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .update-bar { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50;
    background: var(--brand); color: #fff; border-radius: 14px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
  .update-bar button { border: 0; border-radius: 10px; padding: 8px 12px; background: #fff; color: var(--brand); font-weight: 700; }
  h1 { font-size: 1.35rem; margin: 4px 0 14px; }
  h2 { font-size: 1.05rem; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .back { border: 0; background: none; color: var(--brand); padding: 0; font-weight: 600; margin-bottom: 8px; }

  .sectors { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
  .sector {
    text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 6px;
  }
  .sector:not(:disabled):hover { border-color: var(--brand); }
  .sector:disabled { opacity: .55; cursor: default; }
  .sector b { font-size: 1.15rem; }
  .sector span { color: var(--muted); font-size: .92rem; }
  .sector .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

  .tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--brand-soft); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
  .tabs button { border: 0; background: none; padding: 8px 2px; font-size: .84rem; line-height: 1.15; border-radius: 9px; font-weight: 600; color: var(--brand); position: relative; }
  .tabs button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: .72rem; margin-left: 4px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  form label { display: block; font-weight: 600; font-size: .9rem; margin: 12px 0 4px; }
  form label small { font-weight: 400; color: var(--muted); }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  textarea { resize: vertical; min-height: 70px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .two > *, .three > * { min-width: 0; }
  @media (max-width: 520px) { .three { grid-template-columns: 1fr 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: .85rem; }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stat-box summary::-webkit-details-marker { display: none; }
  .stat-box[open] summary b { color: var(--brand); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: .85rem; }
  .cal .h { font-weight: 700; color: var(--muted); padding: 4px 0; }
  .cal button, .cal span.d { border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; background: var(--card); }
  .cal span.d.closed { background: #f0eeea; color: #b0aaa0; border-color: transparent; }
  .cal button.absent { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 700; }
  .cal .today { outline: 2px solid var(--accent); }
  .hint { font-size: .84rem; color: var(--muted); margin: 4px 0 0; }
  .error { color: var(--danger); font-size: .88rem; margin: 10px 0 0; }

  .btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--brand); color: #fff; font-weight: 600; text-align: center; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--brand-dark); }
  .btn:disabled { background: #b9c2bf; cursor: not-allowed; }
  .btn.secondary { background: var(--card); color: var(--brand); border: 1px solid var(--brand); }
  .btn.warn { background: var(--accent); }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 6px 10px; font-size: .85rem; }
  .btn.block { width: 100%; padding: 13px; font-size: 1rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  .order { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .order.due { border-color: var(--warn-line); background: var(--warn-bg); }
  .order.late { border-color: #e7b3ae; background: var(--danger-bg); }
  .order .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .order .num { font-weight: 800; color: var(--brand); letter-spacing: .03em; }
  .order .who { font-weight: 600; }
  .order .who a { font-weight: 400; }
  .order .desc { margin: 6px 0 0; font-size: .92rem; white-space: pre-line; }
  .order .dates { margin: 6px 0 0; font-size: .82rem; color: var(--muted); }
  .order .open { border: 0; background: none; color: var(--muted); font-size: .82rem; padding: 0; text-decoration: underline; }
  .pill { display: inline-block; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--brand-soft); color: var(--brand); }
  .pill.sprejeto { background: #eef0f6; color: #4a5a8a; }
  .pill.caka { background: var(--brand-soft); color: var(--brand); }
  .pill.opomnik, .pill.opomnjeno { background: var(--warn-bg); color: #a3591b; border: 1px solid var(--warn-line); }
  .pill.humana, .pill.opozorilo { background: var(--danger-bg); color: var(--danger); }
  .pill.zamudnina { background: var(--warn-bg); color: #a3591b; border: 1px solid var(--warn-line); }
  .pill.zamuda { background: var(--warn-bg); color: #a3591b; border: 1px solid var(--warn-line); }
  .pill.izdano { background: #eceeed; color: var(--muted); }
  .pill.zavrzeno { background: #eceeed; color: var(--muted); text-decoration: line-through; }

  .customer { margin-bottom: 14px; }
  .customer > .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .customer > .head b { font-size: 1.05rem; }
  .empty { color: var(--muted); text-align: center; padding: 22px 0; }
  .search { position: sticky; top: 64px; z-index: 5; background: var(--bg); padding: 4px 0 10px; }
  .search input { border-radius: 999px; padding: 12px 16px; font-size: 1rem; }

  .done { text-align: center; }
  .done .bignum { font-size: 2.2rem; font-weight: 800; color: var(--brand); letter-spacing: .06em; margin: 4px 0; }
  .callout { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
  .callout.ok { background: var(--brand-soft); border-color: #b9d1c7; }
  .policy { font-size: .88rem; }
  .report { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .report td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .report tr:first-child td { border-top: 0; }
  .policy ol { margin: 6px 0 0; padding-left: 20px; }
  details summary { cursor: pointer; color: var(--brand); font-weight: 600; margin: 18px 0 10px; }
  .svc-group { border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; margin-top: 6px; background: var(--card); }
  .svc-group summary { margin: 0; padding: 10px 0; }
  .svc-group summary small { color: var(--muted); font-weight: 400; }
  .svc-group[open] { padding-bottom: 10px; }
  .svc-group .chips { margin-top: 0; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: grid; place-items: end center; }
  @media (min-width: 640px) { .modal-bg { place-items: center; } }
  .modal { background: var(--bg); width: min(560px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .modal { border-radius: 18px; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .modal-head h3 { margin: 0; font-size: 1.1rem; }
  .close { border: 0; background: none; font-size: 1.6rem; line-height: 1; color: var(--muted); }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .9rem; white-space: pre-line; }
  .timeline { list-style: none; padding: 0; margin: 10px 0 0; font-size: .88rem; }
  .timeline li { padding: 4px 0 4px 18px; position: relative; color: var(--muted); }
  .timeline li::before { content: ''; position: absolute; left: 4px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .timeline li.on { color: var(--text); }
  .timeline li.on::before { background: var(--brand); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 40; font-size: .92rem; max-width: calc(100% - 32px); }
  .loading { opacity: .6; pointer-events: none; }
  #print { display: none; }

  /* ---------- Slog Bucka Dizajn ---------- */
  header {
    background: rgba(255, 255, 255, .92); color: var(--text);
    -webkit-backdrop-filter: saturate(160%) blur(10px); backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--line); box-shadow: 0 2px 14px rgba(214, 84, 160, .08);
  }
  .logo-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--grad); display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(214, 84, 160, .35); flex: none; }
  .logo-mark img { width: 34px; height: 34px; }
  .logo b { font-size: 1.15rem; font-weight: 700; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo small { color: var(--muted); opacity: 1; font-weight: 500; }
  .mode { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .iconbtn { background: #fff; color: var(--text); border: 1.5px solid var(--pink); border-radius: 999px; padding: 7px 14px; font-weight: 600; }
  h1, h2 { font-weight: 700; color: var(--text); letter-spacing: -.01em; }
  h1 { font-size: 1.55rem; }
  .back { color: var(--brand); }

  .btn { background: var(--grad); border-radius: 999px; padding: 10px 18px; box-shadow: 0 6px 16px rgba(214, 84, 160, .28); font-weight: 600; transition: transform .1s, box-shadow .15s; }
  .btn:hover { background: var(--grad); box-shadow: 0 8px 22px rgba(214, 84, 160, .38); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { background: #d9cfd6; box-shadow: none; }
  .btn.secondary { background: #fff; color: var(--brand); border: 1.5px solid #f3b6d4; box-shadow: none; }
  .btn.secondary:hover { border-color: var(--pink); background: var(--brand-soft); }
  .btn.warn { background: linear-gradient(90deg, #f59e42, #f0609e); }
  .btn.danger { background: linear-gradient(90deg, #f0607a, #d63c5e); }
  .btn.small { padding: 6px 12px; }
  .btn.block { padding: 13px; }

  .tabs { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px; box-shadow: var(--shadow); }
  .tabs button { border-radius: 999px; color: var(--text); font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--grad); color: #fff; box-shadow: 0 4px 12px rgba(214, 84, 160, .3); }
  .tabs button[aria-selected="true"] .count { background: #fff !important; color: var(--brand); }
  .count { background: var(--grad); }

  .card, .order, .sector { border-color: var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .sector:not(:disabled):hover { border-color: var(--pink); box-shadow: 0 10px 28px rgba(214, 84, 160, .18); }
  .sector b { font-size: 1.25rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .order .num, .done .bignum { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .done .bignum { font-weight: 800; }
  input, select, textarea { border-color: var(--line); border-radius: 12px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px rgba(240, 96, 158, .15); }
  .search input { border: 1.5px solid #f3b6d4; }
  .chip { border-color: #f1d3e3; }
  .chip:hover { border-color: var(--pink); color: var(--brand); }
  .chip.on, .chip.on:hover { background: var(--grad); border-color: transparent; color: #fff; }
  .stat-box summary { margin: 0; }
  @media (max-width: 640px) {
    .tabs { border-radius: 16px; }
    .tabs button { border-radius: 12px; }
  }
  .callout.ok { background: var(--brand-soft); border-color: #f3c5dd; }
  .pill { background: var(--brand-soft); color: var(--brand); }
  .pill.sprejeto { background: #efe9fe; color: #6d4bd8; }
  .pill.caka, .pill.opomnjeno { background: var(--brand-soft); color: var(--brand); }
  .modal { background: var(--bg); border-radius: 22px 22px 0 0; }
  @media (min-width: 640px) { .modal { border-radius: 22px; } }
  .cal button.absent { background: var(--grad); border-color: transparent; }
  .cal .today { outline-color: var(--pink); }
  .update-bar { background: var(--grad); }
  .update-bar button { color: var(--brand); }
  .toast { background: var(--text); }
  /* Prevzemni listek za termo tiskalnik (papir 56 mm, potisk ~48 mm) */
  .ticket { width: 48mm; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #000; font-size: 8.5pt; line-height: 1.3; }
  .ticket .t-shop { font-size: 7.5pt; text-align: center; }
  .ticket .t-shop b { font-size: 10pt; }
  .ticket .t-title { margin-top: 2.5mm; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 7.5pt; text-align: center; }
  .ticket .t-num { font-size: 18pt; font-weight: 800; letter-spacing: .04em; text-align: center; line-height: 1.1; }
  .ticket table { width: 100%; border-collapse: collapse; margin: 1.5mm 0; }
  .ticket td { padding: .3mm 0; vertical-align: top; }
  .ticket td:last-child { text-align: right; font-weight: 600; }
  .ticket ul { margin: 1mm 0; padding-left: 4mm; }
  .ticket p { margin: 1mm 0; }
  .ticket .t-terms { font-size: 6.8pt; line-height: 1.3; margin-top: 1.5mm; border-top: 1px dashed #000; padding-top: 1.5mm; }
  .ticket .t-cut { margin: 3mm 0 2mm; font-size: 7pt; white-space: nowrap; overflow: hidden; }
  .ticket .t-staff .t-num { font-size: 15pt; }
  .ticket ol { margin: 1mm 0; padding-left: 4mm; }
  @media print {
    @page { size: 56mm auto; margin: 0; }
    html, body { background: #fff; margin: 0; }
    body > *:not(#print) { display: none !important; }
    #print { display: block; padding: 3mm 4mm; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#/">
    <span class="logo-mark" aria-hidden="true"><img src="logo-stroj.png" alt=""></span>
    <span><b>Bucka Dizajn</b><small>Pick&amp;Collect<span class="mode" id="mode"></span></small></span>
  </a>
  <button class="iconbtn" data-nav="#/nastavitve" aria-label="Nastavitve">Nastavitve</button>
</header>

<main id="app"></main>
<div id="modal"></div>
<div id="print"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================================================================
   NASTAVITVE POSLOVALNICE
   Roke nastavite enako tudi v google-apps-script/Code.gs.
   ================================================================ */
const CONFIG = {
  shopName: 'Bucka Dizajn',
  phone: '040 428 401',
  address: 'Ulica Hermana Potočnika 7, 1000 Ljubljana',
  hours: 'ponedeljek zaprto; torek, četrtek in petek 10.00–14.00; sreda 14.00–18.00',

  pickupWorkDays: 14,   // stranka ima za prevzem toliko delovnih dni od obvestila »gotovo«
  lateFeePerDay: 0.5,   // zamudnina v € za vsak dan po roku (če stranka ne sporoči drugače)
  discardAfterMonths: 1, // po toliko mesecih od obvestila »gotovo« neprevzeta oblačila oddamo v zabojnik
  minOpenDaysAfterDeadline: 3, // oddaja v zabojnik najprej toliko delovnih dni po roku (npr. ob praznikih)
  donation: 'Humana',

  // Dnevi, ko je poslovalnica odprta – po njih se štejejo roki (0 = nedelja … 6 = sobota).
  workDays: [2, 3, 4, 5],
  // Slovenski dela prosti prazniki se izračunajo sami (tudi velika noč); sem dodajte le izredne proste dni.
  holidays: [],
};

// Začetni seznam storitev po ceniku Bucka Dizajn (brez cen – cene so v blagajni). Urejate ga v aplikaciji (Nastavitve → Storitve).
const DEFAULT_SERVICES = [
  // Hlače
  { group: 'Hlače', name: 'Krajšanje hlač strojno' },
  { group: 'Hlače', name: 'Krajšanje hlač jersey' },
  { group: 'Hlače', name: 'Krajšanje hlač (razporek, zavihek, trak, elastika)' },
  { group: 'Hlače', name: 'Krajšanje hlač original rob' },
  { group: 'Hlače', name: 'Krajšanje hlač skriti rob' },
  { group: 'Hlače', name: 'Krajšanje hlač nataknjen rob' },
  { group: 'Hlače', name: 'Ožanje ali širjenje hlač v pasu' },
  { group: 'Hlače', name: 'Ožanje hlač jeans v pasu' },
  { group: 'Hlače', name: 'Ožanje ali širjenje hlačnice' },
  { group: 'Hlače', name: 'Menjava skrite zadrge do 20 cm' },
  { group: 'Hlače', name: 'Menjava skrite zadrge nad 20 cm' },
  { group: 'Hlače', name: 'Menjava zadrge' },

function lsGet(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch { return false; } }

/* ---------- Datumi (vse v obliki LLLL-MM-DD) ---------- */

const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
let notes = []; // zapiski v »Uredi danes«: { id, text, date, createdAt }
let absences = []; // dnevi odsotnosti (LLLL-MM-DD) – poslovalnica je zaprta

// Slovenski dela prosti dnevi za leto y: { 'LLLL-MM-DD': ime }.
const holidayCache = {};
function holidaysOf(y) {
  if (holidayCache[y]) return holidayCache[y];
  // Velika noč (gregorijanski koledar).
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const easter = `${y}-${pad(Math.floor((h + l - 7 * m + 114) / 31))}-${pad(((h + l - 7 * m + 114) % 31) + 1)}`;
  return (holidayCache[y] = {
    [`${y}-01-01`]: 'novo leto', [`${y}-01-02`]: 'novo leto', [`${y}-02-08`]: 'Prešernov dan',
    [easter]: 'velikonočna nedelja', [addDays(easter, 1)]: 'velikonočni ponedeljek',
    [`${y}-04-27`]: 'dan upora proti okupatorju', [`${y}-05-01`]: 'praznik dela', [`${y}-05-02`]: 'praznik dela',
    [addDays(easter, 49)]: 'binkošti', [`${y}-06-25`]: 'dan državnosti', [`${y}-08-15`]: 'Marijino vnebovzetje',
    [`${y}-10-31`]: 'dan reformacije', [`${y}-11-01`]: 'dan spomina na mrtve',
    [`${y}-12-25`]: 'božič', [`${y}-12-26`]: 'dan samostojnosti in enotnosti',
  });
}
const holidayName = (s) => holidaysOf(Number(s.slice(0, 4)))[s] || (CONFIG.holidays.includes(s) ? 'prost dan' : '');
const isWorkDay = (s) => CONFIG.workDays.includes(parse(s).getDay()) && !holidayName(s) && !absences.includes(s);
function addWorkDays(s, n) {
  let x = s;
  while (n > 0) { x = addDays(x, 1); if (isWorkDay(x)) n--; }
  return x;
}
const fmt = (s) => { if (!s) return ''; const d = parse(s); return `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()}`; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const maxIso = (a, b) => (a > b ? a : b);

/* ---------- Faze naročila in roki ---------- */

function addMonths(s, n) {
  const d = parse(s);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return iso(d);
}
function prevWorkDay(s) {
  let x = addDays(s, -1);
  while (!isWorkDay(x)) x = addDays(x, -1);
  return x;
}
const reminderDue = (o) => prevWorkDay(o.deadline);             // opomnik: delovni dan pred rokom
// Prvi dan od s naprej, ko je poslovalnica odprta.
function openOnOrAfter(s) {
  let x = s;
  while (!isWorkDay(x)) x = addDays(x, 1);
  return x;
}
// Oddaja v zabojnik: en mesec po »gotovo« (prvi odprti dan), a ne prej kot nekaj delovnih dni po roku.
const discardDue = (o) => maxIso(openOnOrAfter(addMonths(o.readyDate, CONFIG.discardAfterMonths)),
  addWorkDays(o.deadline, CONFIG.minOpenDaysAfterDeadline));
// Drugi opomnik: prvi odprti dan po roku za prevzem (približno teden pred dobrodelno oddajo).
const secondReminderDue = (o) => openOnOrAfter(addDays(o.deadline, 1));
const dayWord = (n) => (n === 1 ? 'dan' : n === 2 ? 'dneva' : n < 5 ? 'dnevi' : 'dni');
// Zamudnina: koledarski dnevi po roku za prevzem (do danes oziroma do izdaje).
// Zamudnina: delovni dnevi (ko je poslovalnica odprta) po roku za prevzem – do danes oziroma do izdaje.
function lateDays(o, t = today()) {
  if (!o.deadline) return 0;
  const end = o.handedDate || t;
  let n = 0;
  for (let d = addDays(o.deadline, 1); d <= end; d = addDays(d, 1)) if (isWorkDay(d)) n++;
  return n;
}
// Rok za prevzem se izračuna sproti, da upošteva tudi kasneje vpisane odsotnosti.
function refreshDeadlines() {
  orders.forEach((o) => { if (o.status === 'gotovo' && o.readyDate) o.deadline = addWorkDays(o.readyDate, CONFIG.pickupWorkDays); });
}
const lateFee = (o, t) => (o.feeWaived ? 0 : lateDays(o, t) * CONFIG.lateFeePerDay);

function stage(o, t = today()) {
  if (o.status === 'sprejeto') return { key: 'sprejeto', label: sec(o).workTab };
  if (o.status === 'izdano') return { key: 'izdano', label: 'Izdano' };
  if (o.status === 'zavrzeno') return { key: 'zavrzeno', label: 'Podarjeno v dobrodelne namene' };
  // status 'gotovo'
  if (!o.readyDate || !o.deadline) return { key: 'caka', label: 'Čaka na prevzem' }; // nepopolni podatki
  if (t >= discardDue(o)) return { key: 'humana', label: 'Ni prevzeto v enem mesecu', due: true };
  if (!o.readyNotified) return { key: 'obvesti', label: 'Stranka še ni obveščena', due: true };
  if (!o.warnDate && t >= secondReminderDue(o)) return { key: 'opozorilo', label: 'Pošlji drugi opomnik', due: true };
  if (t > o.deadline) {
    const n = lateDays(o, t);
    return { key: 'zamuda', label: `Zamuda ${n} ${n === 1 ? 'del. dan' : 'del. dni'}${o.feeWaived ? ' · brez zamudnine' : ` · ${money(lateFee(o, t))}`}` };
  }
  if (!o.reminderDate && t >= reminderDue(o)) return { key: 'opomnik', label: 'Pošlji prvi opomnik', due: true };
  const left = daysBetween(t, o.deadline);
  return { key: o.reminderDate ? 'opomnjeno' : 'caka', label: left === 0 ? 'Rok za prevzem je danes' : `Čaka na prevzem · še ${left} ${dayWord(left)}` };
}

/* ---------- Sporočila strankam ---------- */

function message(type, o) {
  const end = `\n\nDelovni čas: ${CONFIG.hours}.\n${CONFIG.shopName}, ${CONFIG.address}, tel. ${CONFIG.phone}`;
  const nar = o.sector === 'narocilo';
  // Besede za popravila (oblačila, množina) ali naročila (naročilo, ednina).
  const W = nar
    ? { your: `vaše naročilo (št. ${o.num})`, yours: `vašega naročila (št. ${o.num})`, isReady: 'je pripravljeno', them: 'ga', waits: 'še vedno čaka', left: 'Izdelke, ki niso prevzeti', leftLow: 'izdelke, ki niso prevzeti' }
    : { your: `vaša oblačila (št. ${o.num})`, yours: `vaših oblačil (št. ${o.num})`, isReady: 'so pripravljena', them: 'jih', waits: 'še vedno čakajo', left: 'Oblačila, ki niso prevzeta', leftLow: 'oblačila, ki niso prevzeta' };
  if (type === 'ready') {
    return `Pozdravljeni, ${W.your} ${W.isReady} na prevzem. Prevzamete ${W.them} lahko do ${fmt(o.deadline)}. ` +
      `Po preteku roka se za vsak delovni dan zaračuna zamudnina v višini ${String(CONFIG.lateFeePerDay).replace('.', ',')} €. ` +
      `${nar ? 'Naročilo, ki ga' : 'Oblačila, ki jih'} ne boste prevzeli v enem mesecu od prejema obvestila (${fmt(discardDue(o))}), ` +
      `bomo podarili v dobrodelne namene.` + end;
  }
  const feeText = `za vsak delovni dan zaračuna zamudnina v višini ${String(CONFIG.lateFeePerDay).replace('.', ',')} €`;
  if (type === 'reminder') {
    const when = addDays(today(), 1) === o.deadline ? `jutri (${fmt(o.deadline)})` : dayLabel(o.deadline).toLowerCase();
    return `Pozdravljeni, opominjamo vas, da je ${when} zadnji dan za prevzem ${W.yours} brez zamudnine. ` +
      `Po preteku roka se ${feeText}.` + end;
  }
  // Drugi opomnik (po roku za prevzem): zamudnina in datum dobrodelne oddaje.
  const late = lateDays(o) > 0 && !o.feeWaived;
  return (late
    ? `Pozdravljeni, rok za prevzem ${W.yours} je potekel ${fmt(o.deadline)}, zato se ${feeText}; do danes znaša ${money(lateFee(o))}. `
    : `Pozdravljeni, ${W.your} ${W.waits} na prevzem. `) +
    `${nar ? 'Naročilo, ki ga' : 'Oblačila, ki jih'} ne boste prevzeli do ${fmt(discardDue(o))}, bomo podarili v dobrodelne namene.` + end;
}
const MSG_TITLE = { ready: 'Obvestilo: pripravljeno na prevzem', reminder: 'Prvi opomnik', warning: 'Drugi opomnik' };
// Drugi opomnik se zapiše v polje warnDate (prej »opozorilo pred oddajo«).
const MSG_FIELD = { ready: 'readyNotified', reminder: 'reminderDate', warning: 'warnDate' };

function smsLink(phone, text) {
  const n = phone.replace(/[^\d+]/g, '');
  const sep = /iPhone|iPad|Mac/.test(navigator.userAgent) ? '&' : '?';
  return `sms:${n}${sep}body=${encodeURIComponent(text)}`;
}

/* ---------- Shranjevanje: lokalno ali Google preglednica ---------- */

const settings = lsGet(SETTINGS_KEY, { url: '', key: '' });
let orders = [];
let serviceList = DEFAULT_SERVICES;
let customerRecords = []; // shranjene stranke: { id, name, phone, email, note, createdAt }

async function fetchJson(url, opts) {
  const text = await (await fetch(url, opts)).text();
  try { return JSON.parse(text); } catch (e) { throw new Error('Skripta ni vrnila podatkov – v Apps Script uvedite novo različico (Deploy → Manage deployments → New version, dostop Anyone).'); }
}

// Rezervna pot, če brskalnik zavrne fetch: odgovor naložimo kot <script> (JSONP).
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'buckaCb' + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    const timer = setTimeout(() => { done(); reject(new TypeError('Load failed')); }, 20000);
    window[cb] = (data) => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new TypeError('Load failed')); };
    s.src = url + '&cb=' + cb;
    document.head.appendChild(s);
  });
}

const store = {
  remote: () => !!settings.url,
  async call(action, payload = {}) {
    // Manjše zahteve gredo kot GET (zanesljivejše pri Google Apps Script), večje kot POST.
    const body = JSON.stringify({ key: settings.key, action, ...payload });
    const getUrl = settings.url + (settings.url.includes('?') ? '&' : '?') + 'p=' + encodeURIComponent(body);
    let json;
    if (getUrl.length <= 6000) {
      try { json = await fetchJson(getUrl); } catch (e) { if (!(e instanceof TypeError)) throw e; json = await jsonp(getUrl); }
    } else {
      json = await fetchJson(settings.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
    }
    if (!json.ok) throw new Error(json.error || 'Napaka strežnika');
    return json;
  },
  async load() {
    if (this.remote()) {
      const res = await this.call('list');
      orders = res.orders;
      serviceList = res.services && res.services.length ? res.services : DEFAULT_SERVICES;
      customerRecords = res.customers || [];
      absences = res.absences || [];
      notes = res.notes || [];
    } else {
      orders = lsGet(LOCAL_KEY, []);
      serviceList = lsGet(SERVICES_KEY, DEFAULT_SERVICES);
      customerRecords = lsGet(CUSTOMERS_KEY, []);
      absences = lsGet(ABSENCES_KEY, []);
      notes = lsGet(NOTES_KEY, []);
    }
    orders.forEach((o) => {
      if (!Array.isArray(o.services)) o.services = [];
      if (!Array.isArray(o.items)) o.items = [];
    });
    refreshDeadlines();
  },
  async saveServices(list) {
    if (this.remote()) await this.call('saveServices', { services: list });
    else if (!lsSet(SERVICES_KEY, list)) throw new Error('Shranjevanje ni uspelo');
    serviceList = list;
  },
  async saveAbsences(list) {
    if (this.remote()) await this.call('saveAbsences', { absences: list });
    else if (!lsSet(ABSENCES_KEY, list)) throw new Error('Shranjevanje ni uspelo');
    absences = list;
    refreshDeadlines();
  },
  async saveNote(n) {
    if (this.remote()) n = (await this.call('saveNote', { note: n })).note;
    else if (!n.id) { n.id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()); n.createdAt = new Date().toISOString(); }
    const i = notes.findIndex((x) => x.id === n.id);
    if (i >= 0) notes[i] = n; else notes.push(n);
    if (!this.remote() && !lsSet(NOTES_KEY, notes)) throw new Error('Shranjevanje ni uspelo');
  },
  async deleteNote(id) {
    if (this.remote()) await this.call('deleteNote', { id });
    notes = notes.filter((x) => x.id !== id);
    if (!this.remote()) lsSet(NOTES_KEY, notes);
  },
  async saveCustomer(c) {
    if (this.remote()) {
      c = (await this.call('saveCustomer', { customer: c })).customer;
    } else {
      if (!c.id) { c.id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()); c.createdAt = new Date().toISOString(); }
    }
    const i = customerRecords.findIndex((x) => x.id === c.id);
    if (i >= 0) customerRecords[i] = c; else customerRecords.push(c);
    if (!this.remote() && !lsSet(CUSTOMERS_KEY, customerRecords)) throw new Error('Shranjevanje ni uspelo');
    return c;
  },
  async create(o) {
    if (this.remote()) {
      const saved = (await this.call('create', { order: o })).order;
      orders.push(saved);
      return saved;
    }
    o.id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
    const prefix = sec(o).prefix;
    o.num = prefix + pad4(orders.filter((x) => String(x.num).startsWith(prefix))
      .reduce((m, x) => Math.max(m, Number(x.num.slice(prefix.length)) || 0), 0) + 1);
    o.createdAt = new Date().toISOString();
    orders.push(o);
    this.saveLocal();
    return o;
  },
  async update(id, patch) {
    const i = orders.findIndex((o) => o.id === id);
    if (this.remote()) {
      orders[i] = (await this.call('update', { id, patch })).order;
    } else {
      orders[i] = { ...orders[i], ...patch, updatedAt: new Date().toISOString() };
      this.saveLocal();
    }
    return orders[i];
  },
  // Odstrani stranko in njena zaključena naročila (odprtih ne – te je treba najprej izdati).
  async deleteCustomer(c) {
    const orderIds = c.orders.map((o) => o.id);
    if (this.remote()) await this.call('deleteCustomer', { id: c.record?.id || '', orderIds });
    customerRecords = customerRecords.filter((x) => x !== c.record);
    orders = orders.filter((o) => !orderIds.includes(o.id));
    if (!this.remote()) { lsSet(CUSTOMERS_KEY, customerRecords); this.saveLocal(); }
  },
  saveLocal() {
    if (!lsSet(LOCAL_KEY, orders)) toast('Shranjevanje na napravo ni uspelo!');
  },

/* ---- Stranke (shranjene stranke in stranke iz starejših naročil; ključ je telefonska številka) ---- */

function customers() {
  const m = new Map();
  for (const r of customerRecords) {
    const key = digits(r.phone);
    if (key) m.set(key, { ...r, key, record: r, orders: [], last: '' });
  }
  const byDate = [...orders].sort((a, b) => (a.received + (a.createdAt || '')).localeCompare(b.received + (b.createdAt || '')));
  for (const o of byDate) {
    const key = digits(o.phone);
    if (!key) continue;
    let c = m.get(key);
    if (!c) { c = { key, orders: [], last: '' }; m.set(key, c); }
    if (!c.record) { c.name = o.name; c.phone = o.phone; if (o.email) c.email = o.email; }
    c.last = o.received;
    c.orders.push(o);
  }
  const sortKey = (c) => c.last || (c.createdAt || '').slice(0, 10);
  return [...m.values()].sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
}

function findCustomers(query) {
  const q = norm(query.trim());
  const qd = digits(query);
  if (!q) return customers();
  return customers().filter((c) => norm(c.name).includes(q) || (qd.length >= 3 && c.key.includes(qd)));
}

// Telefonska številka v obliki »040 123 456« (tuje: »+386 40 123 456«) – ne glede na to, kako je vpisana.
function formatPhone(raw) {
  const plus = String(raw).trim().startsWith('+') || String(raw).trim().startsWith('00');
  let d = String(raw).replace(/\D/g, '');
  if (String(raw).trim().startsWith('00')) d = d.slice(2);
  const groups = (x) => x.replace(/(\d{3})(?=\d)/g, '$1 ');
  if (!plus) return groups(d);
  if (d.startsWith('386')) return `+386 ${d.slice(3, 5)}${d.length > 5 ? ' ' : ''}${groups(d.slice(5))}`.trim();
  return '+' + String(raw).replace(/^\s*(\+|00)/, '').replace(/[^\d ]/g, '').replace(/\s+/g, ' ').trim(); // tuje številke pustimo, kot so vpisane
}

// Obrazec za novo stranko ali urejanje obstoječe. Po shranjevanju pokliče done(stranka).
function openCustomerForm(c, done) {
  showModal(c ? 'Uredi stranko' : 'Nova stranka', `
    <form id="custForm" novalidate>
      <label for="fName">Ime in priimek</label>
      <input id="fName" name="name" value="${esc(c?.name)}" autocomplete="off">
      <label for="fPhone">Telefon</label>
      <input id="fPhone" name="phone" type="tel" inputmode="tel" value="${esc(c?.phone)}" placeholder="040 123 456" autocomplete="off">
      <label for="fNote">Opomba <small>(neobvezno)</small></label>
      <input id="fNote" name="note" value="${esc(c?.note)}">
      <p class="error" id="custError" hidden></p>
      <button class="btn block" style="margin-top:14px" id="saveCustomer">Shrani stranko</button>
    </form>`);
  $('#fName').focus();
  $('#fPhone').addEventListener('input', (e) => { e.target.value = formatPhone(e.target.value); });
  $('#saveCustomer').onclick = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData($('#custForm')));
    const err = (m) => { $('#custError').textContent = m; $('#custError').hidden = false; };
    const next = { name: f.name.trim(), phone: formatPhone(f.phone), note: f.note.trim() };
    if (!next.name) return err('Vpiši ime in priimek.');
    if (digits(next.phone).length < 6) return err('Vpiši telefonsko številko.');
    const key = digits(next.phone);
    const dup = customers().find((x) => x.key === key && x.key !== c?.key);
    if (dup) return err(`Stranka s to številko že obstaja: ${dup.name}.`);
    const saved = await busy(async () => {
      const rec = await store.saveCustomer({ ...(c?.record || {}), ...next });
      // Kontaktne podatke posodobi tudi na naročilih te stranke (zanje gredo obvestila).
      if (c) {
        for (const o of c.orders) {
          if (o.name !== next.name || o.phone !== next.phone) {
            await store.update(o.id, { name: next.name, phone: next.phone });
          }
        }
      }
      return rec;
    });
    if (!saved) return;
    closeModal();
    toast(c ? 'Stranka posodobljena' : 'Stranka dodana');
    done(customers().find((x) => x.key === key));
  };
}

async function saveMeasures(c) {
  const f = Object.fromEntries(new FormData($('#measureForm')));
  const err = (msg) => { $('#mError').textContent = msg; $('#mError').hidden = false; };
  const num = (v) => {
    const t = String(v || '').trim().replace(',', '.');
    if (!t) return '';
    const n = Number(t);
    return Number.isFinite(n) && n > 0 && n < 400 ? n : NaN;
  };
  const values = {};
  for (const [k, label] of MEASURES) {
    const n = num(f[k]);
    if (Number.isNaN(n)) return err(`${label}: vpiši število v cm (npr. 92 ali 92,5).`);
    if (n !== '') values[k] = n;
  }
  const extra = [];
  for (const x of extraRows) {
    if (!x.name.trim() && !String(x.value).trim()) continue;
    const n = num(x.value);
    if (!x.name.trim()) return err('Pri dodatni meri vpiši ime.');
    if (n === '' || Number.isNaN(n)) return err(`${x.name}: vpiši število v cm.`);
    extra.push({ name: x.name.trim(), value: n });
  }
  if (f.date > today()) return err('Datum merjenja ne more biti v prihodnosti.');
  const measures = { values, extra, date: f.date || today(), note: (f.note || '').trim() };
  const ok = await busy(() => store.saveCustomer({ ...(c.record || { name: c.name, phone: c.phone, email: c.email || '' }), measures }).then(() => true));
  if (ok) { toast('Mere shranjene'); render(); }
}

const garmentTypes = () => serviceGroups().map(([g]) => g).filter((g) => g !== EXTRA_GROUP && !CUSTOM_GROUPS.includes(g));

// Vrstice »Skupina; Storitev« (dodatni stolpci, npr. cena, se prezrejo).
function parseServices(text) {
  const list = [];
  const errors = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim() || line.trim().startsWith('#')) return;
    const parts = line.split(/[;\t]/).map((x) => x.trim());
    if (parts.length < 2 || !parts[0] || !parts[1]) { errors.push(i + 1); return; }
    list.push({ group: parts[0], name: parts[1] });
  });
  return { list, errors };
}
// Vrstica CSV z vejicami → »Skupina; Storitev«.
function csvLine(l) {
  if (l.includes(';') || l.includes('\t')) return l;
  const p = l.split(',').map((x) => x.trim().replace(/^"|"$/g, ''));
  return p.length >= 2 ? `${p[0]}; ${p[1]}` : l;
}
const servicesToText = (list) => list.map((x) => `${x.group}; ${x.name}`).join('\n');

const digits = (s) => String(s || '').replace(/\D/g, '').replace(/^386/, '0');
const pieces = (n) => (Number(n) === 1 ? 'kos' : Number(n) === 2 ? 'kosa' : Number(n) === 3 || Number(n) === 4 ? 'kosi' : 'kosov');

  const items = intakeItems.map((it) => ({ garment: it.garment, services: [...it.services], note: it.note.trim() }));

function monthReport(month) {
  const os = orders.filter((o) => inSector(o));
  const inM = (d) => d && d.startsWith(month);
  const received = os.filter((o) => inM(o.received));
  const ready = os.filter((o) => inM(o.readyDate));
  const handed = os.filter((o) => o.status === 'izdano' && inM(o.handedDate));
  const donated = os.filter((o) => o.status === 'zavrzeno' && inM(o.discardedDate));
  const pcs = (list) => list.reduce((n, o) => n + (Number(o.pieces) || 0), 0);
  // Obisk: različne stranke, ki so ta dan oddale ali prevzele (po telefonu).
  const visits = {};
  const visit = (d, o) => { (visits[d] = visits[d] || new Set()).add(digits(o.phone)); };
  received.forEach((o) => visit(o.received, o));
  handed.forEach((o) => visit(o.handedDate, o));
  const days = [];
  for (let d = `${month}-01`; d.startsWith(month) && d <= today(); d = addDays(d, 1)) {
    if (isWorkDay(d) || visits[d]) days.push([d, visits[d] ? visits[d].size : 0]);
  }
  const sorted = [...days].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  // Najpogostejše storitve (popravila) oziroma izdelki (naročila).
  const count = {};
  received.forEach((o) => (o.items || []).forEach((it) => {
    (SECTOR === 'narocilo' || !it.services.length ? [it.garment] : it.services).forEach((x) => { if (x) count[x] = (count[x] || 0) + 1; });
  }));
  const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const prices = handed.reduce((n, o) => n + (Number(String(o.price).replace(',', '.')) || 0), 0);
  const fees = handed.reduce((n, o) => n + (Number(o.lateFee) || 0), 0);
  const newCustomers = customerRecords.filter((c) => inM((c.createdAt || '').slice(0, 10))).length;
  return { received, ready, handed, donated, pcs, days, most: sorted[0], least: sorted[sorted.length - 1], top, prices, fees, newCustomers,
    visitors: days.reduce((n, [, v]) => n + v, 0) };
}

  const days = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7; // ponedeljek = 0
  const name = first.toLocaleDateString('sl-SI', { month: 'long', year: 'numeric' });
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span></span>');
  for (let d = 1; d <= days; d++) {
    const ds = `${calMonth}-${pad(d)}`;
    const hol = holidayName(ds);
    const regular = CONFIG.workDays.includes(parse(ds).getDay()) && !hol;
    const cls = ds === today() ? 'today' : '';
    cells.push(regular
      ? `<button class="${cls} ${absences.includes(ds) ? 'absent' : ''}" data-absent="${ds}" title="${absences.includes(ds) ? 'Odsotnost – klikni za preklic' : 'Klikni za odsotnost'}">${d}</button>`
      : `<span class="d closed ${cls}" title="${hol ? `Praznik: ${esc(hol)}` : 'Zaprto'}">${d}</span>`);
  }
  const inMonth = absences.filter((a) => a.startsWith(calMonth));
  const hols = Object.entries(holidaysOf(y)).filter(([d]) => d.startsWith(calMonth)).sort();
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <button class="btn small secondary" data-cal="-1" aria-label="Prejšnji mesec">‹</button>
      <b style="text-transform:capitalize">${esc(name)}</b>
      <button class="btn small secondary" data-cal="1" aria-label="Naslednji mesec">›</button>
    </div>
    <div class="cal">${['pon', 'tor', 'sre', 'čet', 'pet', 'sob', 'ned'].map((d) => `<span class="h">${d}</span>`).join('')}${cells.join('')}</div>
    <p class="hint" style="margin-top:8px">Za označitev odsotnosti klikni na določen dan (obarva se rožnato). Dnevi odsotnosti se ne štejejo v rok za prevzem in zamudnino. Sivi prostorčki označujejo dneve, ko je poslovalnica zaprta.</p>
    ${hols.length ? `<p class="hint">Prazniki: ${hols.map(([d, n]) => `${fmt(d)} (${esc(n)})`).join(', ')}</p>` : ''}
    ${inMonth.length ? `<p class="hint">Odsotnost ta mesec: ${inMonth.map((a) => fmt(a)).join(', ')}</p>` : ''}`;
}

// Evidenca za en dan: stranke, katerih oblačila so bila ta dan oddana, v popravilu ali gotova.
function dayStats(day) {
  const repairs = orders.filter((o) => inSector(o));
  const gone = (o) => (o.handedDate && o.handedDate <= day) || (o.discardedDate && o.discardedDate <= day);
  return {
    received: repairs.filter((o) => o.received === day),
    inRepair: repairs.filter((o) => o.received <= day && (!o.readyDate || o.readyDate > day) && !gone(o)),
    ready: repairs.filter((o) => o.readyDate === day),
  };
}

function renderStats() {
  const day = statsDay;
  const st = dayStats(day);
  const box = (label, list, cls) => {
    const people = new Map();
    list.forEach((o) => { const k = digits(o.phone); people.set(k, [...(people.get(k) || []), o]); });
    return `
      <details class="card stat-box" style="padding:12px 14px">
        <summary style="display:flex;justify-content:space-between;align-items:baseline;list-style:none;cursor:pointer">
          <b>▸ ${label}</b>
          <span style="font-size:1.6rem;font-weight:800;color:var(--brand)">${people.size}</span>
        </summary>
        <div class="hint" style="margin:0 0 6px">${people.size === 1 ? 'stranka' : people.size === 2 ? 'stranki' : people.size <= 4 && people.size ? 'stranke' : 'strank'} · ${list.length} ${list.length === 1 ? 'naročilo' : list.length === 2 ? 'naročili' : list.length <= 4 && list.length ? 'naročila' : 'naročil'}</div>
        ${[...people.values()].map((os) => `
          <div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:.9rem">
            <span>${esc(os[0].name)}</span>
            <span>${os.map((o) => `<button class="open" data-open="${esc(o.id)}" style="border:0;background:none;padding:0;color:var(--brand);font-weight:700">${esc(o.num)}</button>`).join(', ')}</span>
          </div>`).join('')}
      </details>`;
  };
  $('#stats').innerHTML = `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
      <button class="btn small secondary" data-day="-1" aria-label="Prejšnji dan">‹</button>
      <input type="date" id="statsDay" value="${day}" max="${today()}" style="flex:1">
      <button class="btn small secondary" data-day="1" aria-label="Naslednji dan" ${day >= today() ? 'disabled' : ''}>›</button>
      ${day !== today() ? '<button class="btn small secondary" data-day="0">Danes</button>' : ''}
    </div>
    <p style="margin:0 0 8px;font-weight:600">${esc(dayLabel(day))}</p>
    <div style="display:grid;gap:8px">
      ${box(SECTORS[SECTOR].workTab, st.inRepair)}
      ${box('Gotovo', st.ready)}
      ${box(SECTORS[SECTOR].receivedBox, st.received)}
    </div>`;
  $('#statsDay').addEventListener('change', (e) => { if (e.target.value) { statsDay = e.target.value > today() ? today() : e.target.value; renderStats(); } });
}

function policyHtml() {
  const nar = SECTOR === 'narocilo';

      <li>Ko ${nar ? 'je naročilo pripravljeno' : 'so oblačila pripravljena'}, stranko obvestimo.</li>
      <li>Za prevzem ima <b>${CONFIG.pickupWorkDays} delovnih dni</b>. Delovni dnevi so dnevi, ko je poslovalnica odprta (brez praznikov in dni odsotnosti).</li>

function orderCard(o, { hideWho = false } = {}) {
  const st = stage(o);
  const cls = st.key === 'humana' || st.key === 'opozorilo' ? 'late' : st.due || st.key === 'zamuda' ? 'due' : '';
  const nar = o.sector === 'narocilo';
  const dates = [`${sec(o).receivedWord} ${fmt(o.received)}`];
  if (o.dueDate && o.status === 'sprejeto') dates.push(`${nar ? 'izdaja' : 'dogovorjeno do'} ${fmt(o.dueDate)}`);
  if (o.readyDate) dates.push(`gotovo ${fmt(o.readyDate)}`);
  if (o.deadline && o.status === 'gotovo') dates.push(`rok za prevzem ${fmt(o.deadline)}`);
  if (o.handedDate) dates.push(`izdano ${fmt(o.handedDate)}`);
  if (o.discardedDate) dates.push(`oddano ${fmt(o.discardedDate)}`);
  return `
    <div class="order ${cls}">
      <div class="top">
        <div><span class="num">${esc(o.num)}</span> ${hideWho ? '' : `· <span class="who">${esc(o.name)} · <a href="tel:${esc(o.phone.replace(/[^\d+]/g, ''))}">${esc(o.phone)}</a></span>`}</div>
        <span class="pill ${st.key}">${esc(st.label)}</span>
      </div>
      <p class="desc">${esc(o.pieces)} ${pieces(o.pieces)} · ${esc(orderText(o))}${o.price ? ` · <b>${esc(money(o.price))}</b>` : ''}</p>
      <p class="dates">${dates.join(' · ')} · <button class="open" data-open="${esc(o.id)}">podrobnosti</button></p>
      <div class="actions">${cardActions(o, st)}</div>

}

// Zadnje obvestilo, ki ga je stranka prejela (za »Ponovno obvesti«).
const lastNotice = (o) => (o.warnDate ? 'warning' : o.reminderDate ? 'reminder' : 'ready');
const telHref = (phone) => `tel:${String(phone || '').replace(/[^\d+]/g, '')}`;

function cardActions(o, st) {
  const id = esc(o.id);
  const issue = (cls = '') => `<button class="btn small ${cls}" data-act="issue" data-id="${id}">Izdaj stranki</button>`;
  const renotify = `<button class="btn small secondary" data-act="notify" data-type="${lastNotice(o)}" data-id="${id}">Ponovno obvesti</button>`;
  let main;
  switch (st.key) {
    case 'sprejeto': main = `<button class="btn small" data-act="ready" data-id="${id}">Označi kot gotovo</button>`; break;
    case 'caka':
    case 'opomnjeno':
    case 'zamuda': main = `${issue()} ${renotify}`; break;
    case 'obvesti': main = `<button class="btn small warn" data-act="notify" data-type="ready" data-id="${id}">Obvesti stranko</button> ${issue('secondary')}`; break;
    case 'opomnik': main = `<button class="btn small warn" data-act="notify" data-type="reminder" data-id="${id}">Pošlji prvi opomnik</button> ${issue('secondary')} ${renotify}`; break;
    case 'opozorilo': main = `<button class="btn small danger" data-act="notify" data-type="warning" data-id="${id}">Pošlji drugi opomnik</button> ${issue('secondary')} ${renotify}`; break;
    case 'humana': main = `${issue()} <button class="btn small danger" data-act="discard" data-id="${id}">Podari v dobrodelne namene</button> ${renotify}`; break;
    default: main = '';
  }
  // Stik s stranko je vedno na voljo (naprava v poslovalnici omogoča klice in SMS).
  return `${main}
    <a class="btn small secondary" href="${esc(telHref(o.phone))}">Kliči</a>
    <button class="btn small secondary" data-sms="${id}">Pošlji SMS</button>`;
}

/* ---------- SMS po želji ---------- */

// Število SMS-ov: s šumniki (č, š, ž) je SMS dolg 70 znakov (67 pri več delih), sicer 160 (153).
function smsCount(text) {
  const unicode = /[^\x00-\x7F€£¥èéùìòÇØøÅåÄäÖöÑñÜüß]/.test(text);
  const one = unicode ? 70 : 160, part = unicode ? 67 : 153;
  return text.length <= one ? 1 : Math.ceil(text.length / part);
}

// Okno za SMS: o = naročilo (ali null), c = stranka { name, phone }.
function openSms(o, c) {
  const who = o || c;
  const free = `Pozdravljeni,\n\n\n${CONFIG.shopName}, tel. ${CONFIG.phone}`;
  const templates = [];
  if (o && o.status === 'gotovo') {
    templates.push(['ready', 'Pripravljeno']);
    templates.push(['reminder', 'Prvi opomnik']);
    templates.push(['warning', 'Drugi opomnik']);
  }
  templates.push(['free', 'Prosto besedilo']);
  const textFor = (t) => (t === 'free' ? free : message(t, o));
  const first = o && o.status === 'gotovo' ? lastNotice(o) : 'free';
  showModal(`Pošlji SMS${o ? ` · ${esc(o.num)}` : ''}`, `
    <p><b>${esc(who.name)}</b> · <a href="${esc(telHref(who.phone))}">${esc(who.phone)}</a></p>
    <div class="chips" style="margin-bottom:8px">${templates.map(([k, l]) => `<button type="button" class="chip ${k === first ? 'on' : ''}" data-tpl="${k}">${esc(l)}</button>`).join('')}</div>
    <textarea id="smsText" rows="8" style="font-size:.92rem">${esc(textFor(first))}</textarea>
    <p class="hint" id="smsInfo"></p>
    <div class="actions">
      <a class="btn" id="smsSend" href="#">Pošlji SMS</a>
      <a class="btn secondary" href="${esc(telHref(who.phone))}">Kliči</a>
      <button class="btn secondary" id="smsCopy">Kopiraj</button>
    </div>
    <p class="hint">Gumb odpre aplikacijo za sporočila na tej napravi z vpisano številko in besedilom – sporočilo pošljete tam.</p>`);
  const area = $('#smsText');
  const update = () => {
    const t = area.value;
    $('#smsSend').href = smsLink(who.phone, t);
    const n = smsCount(t);
    $('#smsInfo').textContent = `${t.length} znakov · ${n} ${n === 1 ? 'SMS' : n === 2 ? 'SMS-a' : 'SMS-i'}`;
  };
  area.addEventListener('input', update);
  $('#modal').querySelectorAll('[data-tpl]').forEach((b) => b.addEventListener('click', () => {
    $('#modal').querySelectorAll('[data-tpl]').forEach((x) => x.classList.toggle('on', x === b));
    area.value = textFor(b.dataset.tpl);
    update();
  }));
  $('#smsCopy').onclick = () => navigator.clipboard?.writeText(area.value).then(() => toast('Kopirano'));
  update();
}

/* ---------- Dejanja ---------- */

async function markReady(id) {
  const t = today();
  const o = await busy(() => store.update(id, { status: 'gotovo', readyDate: t, deadline: addWorkDays(t, CONFIG.pickupWorkDays) }));
  render();
  if (o) openNotify(o, 'ready');
}

async function markNotified(o, type) {
  const t = today();
  const field = MSG_FIELD[type];
  const patch = o[field] ? null : { [field]: t };
  if (patch) await busy(() => store.update(o.id, patch));
  closeModal();
  render();
  toast('Zabeleženo');
}

function openNotify(o, type) {
  const text = message(type, o);
  const already = o[MSG_FIELD[type]];
  showModal(MSG_TITLE[type] + ` · ${esc(o.num)}`, `
    <p><b>${esc(o.name)}</b> · ${esc(o.phone)}</p>
    <div class="msg">${esc(text)}</div>
    <div class="actions">
      <a class="btn" href="${esc(smsLink(o.phone, text))}">Pošlji SMS</a>
      <button class="btn secondary" id="copyMsg">Kopiraj</button>
    </div>
    <button class="btn block ${already ? 'secondary' : ''}" style="margin-top:14px" id="confirmNotify">${already ? 'Zapri' : 'Stranka je obveščena'}</button>`);
  $('#copyMsg').onclick = () => navigator.clipboard?.writeText(text).then(() => toast('Kopirano'));
  $('#confirmNotify').onclick = () => (already ? closeModal() : markNotified(o, type));
}

function confirmIssue(o) {
  const st = stage(o);
  const n = lateDays(o);
  const fee = lateFee(o);
  const total = (Number(o.price) || 0) + fee;
  showModal(`Izdaja ${esc(o.num)}`, `
    <p><b>${esc(o.name)}</b> · ${esc(o.phone)}</p>
    <p>${esc(o.pieces)} ${pieces(o.pieces)} · ${esc(orderText(o))}</p>
    ${o.price ? `<p style="margin:4px 0">Popravilo: <b>${esc(money(o.price))}</b></p>` : ''}
    ${n ? `<p style="margin:4px 0">Zamudnina: ${n} ${n === 1 ? 'delovni dan' : n === 2 ? 'delovna dneva' : n < 5 ? 'delovni dnevi' : 'delovnih dni'} × ${money(CONFIG.lateFeePerDay)} = <b>${money(n * CONFIG.lateFeePerDay)}</b>
      ${o.feeWaived ? '<span class="pill">ne zaračunamo</span>' : ''}</p>` : ''}
    ${o.price || fee ? `<p style="font-size:1.2rem;margin:8px 0">Za plačilo: <b>${money(total)}</b></p>` : ''}
    ${n && !o.feeWaived ? '<label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="waiveFee" style="width:auto"> Zamudnine ne zaračunamo (dogovor s stranko)</label>' : ''}
    ${o.status === 'sprejeto' ? '<div class="callout">To naročilo še ni označeno kot gotovo.</div>' : ''}
    ${st.key === 'humana' ? `<div class="callout">Rok enega meseca je že potekel – preveri, da blago še ni podarjeno v dobrodelne namene.</div>` : ''}
    <button class="btn block" style="margin-top:14px" id="doIssue">Potrdi izdajo stranki</button>`);
  $('#doIssue').onclick = async () => {
    const waive = o.feeWaived || $('#waiveFee')?.checked;
    const ok = await busy(() => store.update(o.id, {
      status: 'izdano', handedDate: today(), feeWaived: waive ? 'da' : '', lateFee: waive ? '' : String(fee || ''),
    }));
    closeModal(); render();
    if (ok) toast(`${o.num} izdano`);
  };
}

function confirmRemoveCustomer(c) {
  const open = c.orders.filter((o) => o.status === 'sprejeto' || o.status === 'gotovo');
  if (open.length) {
    showModal('Stranke ni mogoče odstraniti', `
      <p><b>${esc(c.name)}</b> ima odprta naročila: ${open.map((o) => `<b>${esc(o.num)}</b>`).join(', ')}.</p>
      <p class="hint">Stranko lahko odstranite, ko so vsa njena naročila izdana ali podarjena v dobrodelne namene.</p>`);

  }
  showModal('Odstrani stranko', `
    <p>Odstranim stranko <b>${esc(c.name)}</b> · ${esc(c.phone)}?</p>
    ${c.orders.length ? `<p>Odstranjena bodo tudi njena zaključena naročila (${c.orders.map((o) => esc(o.num)).join(', ')}) in ne bodo več vidna v pregledu.</p>` : ''}
    <p class="hint">Tega ni mogoče razveljaviti.</p>

  $('#cancelRemove').onclick = closeModal;
  $('#doRemoveCustomer').onclick = async () => {
    const ok = await busy(() => store.deleteCustomer(c).then(() => true));

    if (ok) toast('Stranka odstranjena');

// Po enem mesecu aplikacija vpraša, ali naj neprevzeta oblačila podarimo v dobrodelne namene.
function confirmDiscard(o) {
  const nar = o.sector === 'narocilo';
  showModal('Podarim v dobrodelne namene?', `
    <p><b class="num" style="color:var(--brand)">${esc(o.num)}</b> · <b>${esc(o.name)}</b> · ${esc(o.phone)}<br>${esc(o.pieces)} ${pieces(o.pieces)} · ${esc(orderText(o))}</p>
    <p>${nar ? 'Naročilo ni bilo prevzeto' : 'Oblačila niso bila prevzeta'} v enem mesecu od prejema obvestila (${fmt(o.readyNotified || o.readyDate)}).
      Želite ${nar ? 'naročilo' : 'oblačila'} podariti v dobrodelne namene?</p>
    <div class="actions">
      <button class="btn danger" id="doDiscard">Da, podari</button>

  $('#discardIssue').onclick = () => confirmIssue(o);
  $('#doDiscard').onclick = async () => {

    closeModal(); render();

// Ob odprtju sektorja enkrat na dan sam vpraša za naročila, ki niso bila prevzeta v enem mesecu.
const ASKED_KEY = 'bucka-discard-asked';
function askDiscard() {
  if ($('#modal').innerHTML) return;
  const t = today();
  const asked = lsGet(ASKED_KEY, {});
  const o = orders.find((x) => inSector(x) && x.status === 'gotovo' && stage(x, t).key === 'humana' && asked[x.id] !== t);
  if (!o) return;
  asked[o.id] = t;
  lsSet(ASKED_KEY, Object.fromEntries(Object.entries(asked).filter(([, d]) => d === t)));
  confirmDiscard(o);
}

function openDetail(o) {

    [o.sector === 'narocilo' ? 'Naročeno' : 'Oddano', o.received],

    ['Prvi opomnik', o.reminderDate],
    ['Drugi opomnik', o.warnDate],
    ['Rok za prevzem', o.deadline],
    ['Izdano stranki', o.handedDate],
    ['Oddano v dobrodelne namene', o.discardedDate],
  ];
  const editable = o.status === 'sprejeto' || o.status === 'gotovo';
  const dis = editable ? '' : 'disabled';
  showModal(`Naročilo ${esc(o.num)} <span class="pill ${st.key}">${esc(st.label)}</span>`, `
    <form id="editForm" novalidate>
      <p style="margin:0"><b>${esc(o.name)}</b> · ${esc(o.phone)}

      <div class="three">

        <div><label>Kosov</label><input name="pieces" type="number" min="1" value="${esc(o.pieces)}" ${dis}></div>
        <div><label>Cena (€)</label><input name="price" inputmode="decimal" value="${esc(o.price)}" ${dis}></div>
      </div>
      ${o.measures ? `<label>Mere ob naročilu</label><p style="margin:0">${esc(o.measures)}</p>` : ''}
      ${o.items.length ? `<label>Kosi</label><ol style="margin:0;padding-left:20px">${o.items.map((it) => `<li>${esc(itemText(it))}</li>`).join('')}</ol>`
        : o.services.length ? `<label>Storitve</label><p style="margin:0">${o.services.map((x) => `${x.qty > 1 ? x.qty + ' × ' : ''}${esc(svcName(x))}`).join('<br>')}</p>` : ''}
      <label>Opis</label><textarea name="description" ${dis}>${esc(o.description)}</textarea>
      <label>Opomba</label><input name="note" value="${esc(o.note)}" ${dis}>
      ${o.status === 'gotovo' ? `<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="feeWaived" style="width:auto" ${o.feeWaived ? 'checked' : ''}> Brez zamudnine (stranka se je javila)</label>` : ''}

      ${o.status === 'izdano' ? '<button class="btn secondary" id="undoIssue">Razveljavi izdajo</button>' : ''}

    if (f.price.trim() && isNaN(Number(f.price.trim().replace(',', '.')))) return fail('Cena mora biti število.');
    const ok = await busy(() => store.update(o.id, {

// Slovenska množina: 1 naročilo, 2 naročili, 3 naročila, 5 naročil.
function plural(n, one, two, few, many) {
  const m = Math.abs(n) % 100;
  return `${n} ${m === 1 ? one : m === 2 ? two : m === 3 || m === 4 ? few : many}`;
}
const nOrders = (n) => plural(n, 'naročilo', 'naročili', 'naročila', 'naročil');
const nCustomers = (n) => plural(n, 'stranka', 'stranki', 'stranke', 'strank');
const nDays = (n) => plural(n, 'dan', 'dneva', 'dnevi', 'dni');

// Povezava z nastavitvami preglednice – odpre se na drugi napravi in jo poveže z enim dotikom.
function connectLink() {
  const data = btoa(unescape(encodeURIComponent(JSON.stringify({ u: settings.url, k: settings.key }))));
  return `${location.href.split('#')[0]}#/povezi/${encodeURIComponent(data)}`;
}

function renderConnectLink(app) {

  try { cfg = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(route.slice('#/povezi/'.length)))))); } catch { /* neveljavna povezava */ }
  if (!cfg || !/^https:\/\/script\.google(usercontent)?\.com\//.test(cfg.u || '')) {
    app.innerHTML = '<div class="card"><b>Povezava ni veljavna.</b><p class="hint">Ustvarite novo v Nastavitvah na napravi, ki je že povezana.</p><button class="btn" data-nav="#/">Na začetek</button></div>';
    return;
  }
  app.innerHTML = `
    <h1>Poveži to napravo</h1>
    <div class="card">
      <p>Ta naprava se bo povezala z Google preglednico poslovalnice. Nato bo videla iste stranke in naročila kot druge naprave.</p>
      ${orders.length || customerRecords.length ? `<div class="callout">Na tej napravi so že podatki (${nOrders(orders.length)}, ${nCustomers(customerRecords.length)}). Po povezavi jih lahko prenesete v preglednico.</div>` : ''}
      <p class="error" id="linkError" hidden></p>
      <div class="actions"><button class="btn" id="doConnect">Poveži</button><button class="btn secondary" data-nav="#/">Prekliči</button></div>
    </div>`;
  $('#doConnect').onclick = () => connectTo(cfg.u, cfg.k, $('#linkError'));
}

// Poveže napravo s preglednico; če so na napravi lokalni podatki, ponudi prenos.
async function connectTo(url, key, errEl) {
  const local = { orders: lsGet(LOCAL_KEY, []), customers: lsGet(CUSTOMERS_KEY, []), absences: lsGet(ABSENCES_KEY, []) };
  const prev = { ...settings };
  Object.assign(settings, { url, key });
  // Če povezavo blokirajo varnostna pravila strani (CSP gostovanja), to povemo naravnost.
  const blocked = [];
  const onCsp = (e) => blocked.push(e.violatedDirective + ' ' + String(e.blockedURI).split('?')[0]);
  document.addEventListener('securitypolicyviolation', onCsp);
  try {
    await busy(() => store.load(), true);
  } catch (ex) {
    Object.assign(settings, prev);
    const hint = url ? await connectHint(url, ex) : ex.message;
    errEl.textContent = 'Povezava ni uspela: ' + (blocked.length
      ? `brskalnik je povezavo blokiral zaradi varnostnih pravil strani (${blocked[0]}). To nastavi gostovanje (Netlify), ne skripta.`
      : hint);
    errEl.hidden = false;
    return;
  } finally {
    document.removeEventListener('securitypolicyviolation', onCsp);
  }
  lsSet(SETTINGS_KEY, settings);
  history.replaceState(null, '', location.pathname + location.search + '#/');
  route = '#/';
  render();
  toast(url ? 'Povezano' : 'Shranjeno');
  if (url && (local.orders.length || local.customers.length)) offerImport(local);
}

// Ob napaki preveri, ali je skripta sploh dosegljiva in ali je objavljena nova različica kode.
async function connectHint(url, ex) {
  if (!/load failed|failed to fetch|networkerror|respondwith/i.test(ex.message)) return ex.message;
  const old = 'v Apps Script je objavljena stara različica kode. Prilepite novo kodo Code.gs, shranite in izberite Deploy → Manage deployments → ✎ → Version: New version → Deploy.';
  let info;
  try { info = await (await fetch(url)).json(); } catch (e) {
    try { info = await jsonp(url + '?v=1'); } catch (e2) {
      return 'skripta ne odgovarja. Preverite, da je v Apps Script objavljena nova različica kode (Deploy → Manage deployments → ✎ → New version), da je Execute as »Me«, Who has access »Anyone« in da naslov konča z /exec.';
    }
  }
  return info && info.ok && !(info.verzija >= 3) ? old : ex.message;
}

function offerImport(local) {
  showModal('Prenos podatkov s te naprave', `
    <p>Na tej napravi so podatki: <b>${nOrders(local.orders.length)}</b>, <b>${nCustomers(local.customers.length)}</b>${local.absences.length ? ` in ${nDays(local.absences.length)} odsotnosti` : ''}.
      Jih prenesem v preglednico, da jih vidijo vse naprave?</p>
    <p class="hint">Naročila in stranke, ki so v preglednici že zapisani, se ne podvojijo. Če je številka naročila že zasedena, dobi novo številko.</p>
    <div class="actions"><button class="btn" id="doImport">Prenesi v preglednico</button><button class="btn secondary" id="skipImport">Ne zdaj</button></div>`);
  $('#skipImport').onclick = closeModal;
  $('#doImport').onclick = async () => {
    const res = await busy(() => store.call('importAll', local));
    if (!res) return;
    await busy(() => store.load());

    toast(`Preneseno: ${nOrders(res.orders)}, ${nCustomers(res.customers)}`);

/* ---------- Pomožno: modal, toast, nalaganje ---------- */

function showModal(title, html) {
  $('#modal').innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head"><h3>${title}</h3><button class="close" id="closeModal" aria-label="Zapri">×</button></div>
        ${html}
      </div>
    </div>`;
  $('#closeModal').onclick = closeModal;
  $('#modalBg').addEventListener('click', (e) => { if (e.target.id === 'modalBg') closeModal(); });
}
function closeModal() { $('#modal').innerHTML = ''; }

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}

// Izvede asinhrono dejanje in med tem zaklene zaslon; ob napaki prikaže sporočilo in vrne undefined.
async function busy(fn, rethrow = false) {
  document.body.classList.add('loading');
  try { return await fn(); }
  catch (e) {
    if (rethrow) throw e;
    toast('Napaka: ' + e.message);
  } finally { document.body.classList.remove('loading'); }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-additem], [data-removeitem], [data-itemsvc], [data-absent], [data-cal], [data-rep], [data-print], [data-day], [data-sort], [data-nav], [data-open], [data-act], [data-pick], [data-newfor], [data-ordersfor], [data-newcustomer], [data-editcustomer], [data-removecustomer], [data-notedone], [data-noteedit], #addNote, [data-measure], [data-addextra], [data-removeextra], [data-sms], [data-smscust], #newIntake, #saveIntake');
  if (!t) return;
  if (t.dataset.print) { const o = orders.find((x) => x.id === t.dataset.print); if (o) printTicket(o); return; }
  if (t.dataset.day) {
    const n = Number(t.dataset.day);
    statsDay = n === 0 ? today() : addDays(statsDay, n) > today() ? today() : addDays(statsDay, n);
    return renderStats();
  }
  if (t.dataset.sort) { sortNewest = t.dataset.sort === 'new'; lsSet(SORT_KEY, sortNewest); return render(); }
  if (t.dataset.nav) {
    e.preventDefault();
    lastCreated = null;
    if (location.hash === t.dataset.nav) return render();
    return nav(t.dataset.nav);
  }
  if ('additem' in t.dataset) { intakeItems.push({ garment: '', services: [], note: '' }); renderItems(); $(`[data-garment="${intakeItems.length - 1}"]`)?.focus(); return; }
  if (t.dataset.removeitem) { intakeItems.splice(Number(t.dataset.removeitem), 1); return renderItems(); }
  if (t.dataset.itemsvc) {
    const it = intakeItems[Number(t.dataset.itemsvc)];
    const n = t.dataset.name;
    it.services = it.services.includes(n) ? it.services.filter((x) => x !== n) : [...it.services, n];
    return renderItems();
  }
  if (t.dataset.rep) { reportMonth = addMonths(reportMonth + '-01', Number(t.dataset.rep)).slice(0, 7); return renderReport(); }
  if (t.dataset.cal) { calMonth = addMonths(calMonth + '-01', Number(t.dataset.cal)).slice(0, 7); return renderAbsences(); }
  if (t.dataset.absent) {
    const d = t.dataset.absent;
    const next = absences.includes(d) ? absences.filter((x) => x !== d) : [...absences, d].sort();
    busy(() => store.saveAbsences(next)).then(() => renderAbsences());
    return;
  }
  if (t.id === 'newIntake') { lastCreated = null; return render(); }
  if (t.dataset.pick) { intakeKey = t.dataset.pick; return renderCustomerBox(); }
  if (t.dataset.newfor) {
    intakeKey = t.dataset.newfor;
    lastCreated = null;
    return nav(`#/${SECTOR}/prevzem`);
  }
  if (t.dataset.sms) { const o = orders.find((x) => x.id === t.dataset.sms); if (o) openSms(o, null); return; }
  if (t.dataset.smscust) { const c = customers().find((x) => x.key === t.dataset.smscust); if (c) openSms(null, c); return; }
  if (t.dataset.measure) { closeModal(); measureKey = t.dataset.measure; customerQuery = ''; return location.hash === '#/narocilo/mere' ? render() : nav('#/narocilo/mere'); }
  if ('addextra' in t.dataset) { extraRows.push({ name: '', value: '' }); renderExtra(); $(`[data-extra="${extraRows.length - 1}"]`)?.focus(); return; }
  if (t.dataset.removeextra) { extraRows.splice(Number(t.dataset.removeextra), 1); return renderExtra(); }
  if (t.dataset.newcustomer) {
    const from = t.dataset.newcustomer;
    return openCustomerForm(null, (c) => {
      if (from === 'intake') { intakeKey = c.key; renderCustomerBox(); }
      // V sektorju Izdelava po naročilu po vnosu nove stranke takoj odpri vnos mer.
      else if (SECTOR === 'narocilo' && route.startsWith('#/narocilo')) { measureKey = c.key; customerQuery = ''; location.hash === '#/narocilo/mere' ? render() : nav('#/narocilo/mere'); }
      else { customerQuery = ''; render(); }
    });
  }
  if (t.id === 'addNote') return openNoteForm(null);
  if (t.dataset.notedone) return noteDone(t.dataset.notedone);
  if (t.dataset.noteedit) return openNoteForm(notes.find((n) => n.id === t.dataset.noteedit));
  if (t.dataset.removecustomer) {
    const c = customers().find((x) => x.key === t.dataset.removecustomer);
    if (c) confirmRemoveCustomer(c);
    return;
  }
  if (t.dataset.editcustomer) {
    const c = customers().find((x) => x.key === t.dataset.editcustomer);
    if (c) openCustomerForm(c, () => render());
    return;
  }
  if (t.dataset.ordersfor) {
    const c = customers().find((x) => x.key === t.dataset.ordersfor);
    searchQuery = c ? c.phone : '';
    return nav(`#/${SECTOR}/izdaja`);
  }
  if (t.id === 'saveIntake') { e.preventDefault(); return saveIntake(); }
  const o = orders.find((x) => x.id === (t.dataset.open || t.dataset.id));
  if (!o) return;
  if (t.dataset.open) return openDetail(o);
  switch (t.dataset.act) {
    case 'ready': return markReady(o.id);
    case 'notify': return openNotify(o, t.dataset.type);
    case 'issue': return confirmIssue(o);
    case 'discard': return confirmDiscard(o);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ---------- Klici in SMS ---------- */

// Povezave tel: in sms: zanesljivo odpre: na telefonu tudi, ko je aplikacija prikazana v okvirju (iframe),
// na napravi brez telefona pa pokaže številko (in besedilo SMS) za ročni klic oziroma kopiranje.
// Klicati znajo telefoni (iPhone, Android) in Mac (FaceTime in Sporočila prek povezanega iPhona).
const canDial = () => /Android|iPhone|iPad|iPod|Mobile|Macintosh|Mac OS X/i.test(navigator.userAgent);

function contactFallback(href) {
  const isSms = href.startsWith('sms:');
  const [target, query = ''] = href.replace(/^(tel|sms):/, '').split(/[?&]body=/);
  const raw = decodeURIComponent(target);
  const number = /^0\d{8}$/.test(raw) ? raw.replace(/^(\d{3})(\d{3})(\d{3})$/, '$1 $2 $3') : raw;
  const body = isSms ? decodeURIComponent(query) : '';
  showModal(isSms ? 'Pošlji SMS' : 'Pokliči stranko', `
    <p class="hint">Ta naprava ne more neposredno ${isSms ? 'poslati SMS-a' : 'klicati'}. Uporabite telefon poslovalnice:</p>
    <p style="font-size:1.8rem;font-weight:800;letter-spacing:.03em;text-align:center;margin:10px 0">${esc(number)}</p>
    ${isSms ? `<div class="msg">${esc(body)}</div>` : ''}
    <div class="actions" style="justify-content:center">
      <button class="btn" id="copyNumber">Kopiraj številko</button>
      ${isSms ? '<button class="btn secondary" id="copyBody">Kopiraj besedilo</button>' : ''}
      <a class="btn secondary" href="${esc(href)}" data-raw="1">Odpri v aplikaciji</a>
    </div>`);
  $('#copyNumber').onclick = () => navigator.clipboard?.writeText(raw).then(() => toast('Številka kopirana'));
  $('#copyBody')?.addEventListener('click', () => navigator.clipboard?.writeText(body).then(() => toast('Besedilo kopirano')));
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="tel:"], a[href^="sms:"]');
  if (!a || a.dataset.raw) return;
  const href = a.getAttribute('href');
  if (!canDial()) { e.preventDefault(); contactFallback(href); return; }
  if (window.self !== window.top) {
    // V okvirju (npr. predogled) brskalnik povezave ne odpre sam – odpremo jo izrecno.
    e.preventDefault();
    let w = null;
    try { w = window.open(href, '_top'); } catch { /* ni dovoljeno */ }
    if (!w) { try { w = window.open(href, '_blank'); } catch { /* ni dovoljeno */ } }
    if (!w) contactFallback(href);
  }
}, true);

// Ob vrnitvi v aplikacijo osveži podatke iz preglednice (druge naprave, samodejna obvestila).
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && store.remote() && !$('#modal').innerHTML && !document.querySelector('#intakeForm')) {
    try { await store.load(); render(); } catch { /* brez povezave */ }
  }
});

(async () => {
  $('#app').innerHTML = '<p class="empty">Nalagam …</p>';
  try { await store.load(); }
  catch (e) { toast('Nalaganje iz preglednice ni uspelo: ' + e.message); }
  render();
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Ko se naloži nova različica aplikacije, ponudi osvežitev.
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) { hadController = true; return; }
    if ($('.update-bar')) return;
    const bar = document.createElement('div');
    bar.className = 'update-bar';
    bar.innerHTML = '<span>Na voljo je nova različica aplikacije.</span><button type="button">Osveži</button>';
    bar.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(bar);
  });
  navigator.serviceWorker.register('sw.js').then((reg) => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
